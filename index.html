/* Layout: one calm column, generous whitespace, a bottom dock on phones.
   The answer-sheet identity survives only in the details: shaded bubbles and the 80% line. */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --surface-2:#eff1ef; --ink:#17202b; --muted:#68727e; --faint:#a0a8b1; --line:#e5e8e6;
  --accent:#2b4fa6; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --lead:#20252c; --drop:#d0735d;
  --ok:#1e7a4a; --ok-soft:#e5f3eb; --bad:#b32b21; --bad-soft:#fbe9e6; --flag:#996912; --flag-soft:#f7eedb;
  --shadow:0 1px 2px rgba(23,32,43,.04),0 6px 24px rgba(23,32,43,.06);
  --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#161b22; --surface-2:#1d232b; --ink:#e8edf2; --muted:#9aa5b1; --faint:#66717d; --line:#252c35;
  --accent:#93b2ff; --accent-ink:#0b1426; --accent-soft:#1b2640;
  --lead:#e9edf1; --drop:#e48d77;
  --ok:#64c592; --ok-soft:#15301f; --bad:#ff8378; --bad-soft:#391d1a; --flag:#e3b65d; --flag-soft:#31291a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#161b22; --surface-2:#1d232b; --ink:#e8edf2; --muted:#9aa5b1; --faint:#66717d; --line:#252c35;
  --accent:#93b2ff; --accent-ink:#0b1426; --accent-soft:#1b2640;
  --lead:#e9edf1; --drop:#e48d77;
  --ok:#64c592; --ok-soft:#15301f; --bad:#ff8378; --bad-soft:#391d1a; --flag:#e3b65d; --flag-soft:#31291a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header + navigation */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.mark{width:28px;height:28px;border-radius:50%;background:var(--lead);color:var(--bg);display:grid;place-items:center;font:800 13px/1 var(--f-display);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--drop);flex:none}
.brand b{font:780 18px/1 var(--f-display);letter-spacing:-.01em}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease);position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.lvl{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s}
.lvl:hover{border-color:var(--faint)}
.lvl svg{width:12px;height:12px;opacity:.6}
.mcount{font:600 10.5px/1 var(--f-body);padding:3px 6px;border-radius:999px;background:var(--bad);color:#fff;margin-left:4px;vertical-align:1px}
.dock{display:none}
main{padding-block:12px 80px}

/* type */
.eyebrow{font:600 12px/1.3 var(--f-body);letter-spacing:.02em;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(26px,5vw,34px);font-weight:760;line-height:1.12}
h2{font-size:18px;font-weight:700;line-height:1.25}
h3{font-size:15.5px;font-weight:680}
p{margin:0}
.muted{color:var(--muted)}
.lede{font-size:16px;color:var(--muted);max-width:56ch}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel{padding:20px}
.block{margin-top:34px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.footnote{margin-top:28px;font-size:13px;color:var(--faint)}
.empty{padding:22px;color:var(--muted);font-size:14.5px;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:620;font-size:14.5px;cursor:pointer;line-height:1.2;text-align:center;transition:transform .15s var(--ease),background .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:15px 24px;font-size:16px;width:100%}
.btn.quiet{border-color:transparent;background:var(--surface-2)}
.btn.small{padding:8px 14px;font-size:13.5px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .2s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

/* list rows (used for menus) */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu>button,.menu>a{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;text-decoration:none;color:inherit;transition:background .15s}
.menu>button:last-child,.menu>a:last-child{border-bottom:0}
.menu>button:hover{background:var(--surface-2)}
.menu .t{font-weight:640;font-size:15.5px}
.menu .m{font-size:13px;color:var(--muted)}
.menu .grow{flex:1;min-width:0}
.menu .chev{color:var(--faint);flex:none}
.menu .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.menu .ic svg{width:18px;height:18px}

/* home */
.home{display:flex;flex-direction:column;gap:8px;padding-top:18px}
.count{font:780 clamp(64px,16vw,96px)/.95 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.count small{font-size:.3em;font-weight:620;letter-spacing:-.01em;color:var(--muted);margin-left:6px}
.home .sub{color:var(--muted);font-size:15.5px;margin-bottom:22px}
.today{padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);border:0}
.today .why{font-size:14px;color:var(--muted)}
.resume{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft)}
.ready{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;padding:20px}
.ready .nm{font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.ready .nm b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.proj{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.proj .big{font:760 28px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* bars */
.track{position:relative;height:6px;border-radius:3px;background:var(--surface-2);overflow:visible}
.track>span{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent);transform-origin:left;animation:grow .9s var(--ease) both}
.track>span.pass{background:var(--ok)}
.track.cover::after{display:none}
.track::after{content:"";position:absolute;left:80%;top:-3px;bottom:-3px;width:1.5px;background:var(--drop);opacity:.7;border-radius:1px}
.arow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.area-rows{padding:4px 20px}
.arow .nm{font-weight:620;min-width:0;font-size:14.5px}
.arow .nm small{display:block;font-size:12.5px;font-weight:450;color:var(--muted)}
.pct{font-weight:650;font-variant-numeric:tabular-nums;min-width:3em;text-align:right;font-size:14.5px}
.legend80{font-size:12.5px;color:var(--muted)}
.legend80 i{display:inline-block;width:1.5px;height:11px;background:var(--drop);vertical-align:-1px;margin-right:6px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 18px;border-bottom:1px solid var(--line);align-items:center}
.hist li:last-child{border-bottom:0}
.hist .s{font-weight:680;font-variant-numeric:tabular-nums}
.hist .s.pass{color:var(--ok)}
.hist small{color:var(--muted);font-size:12.5px}

/* chips & forms */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:580;font-size:14px;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.dot.on,.chip[aria-pressed="true"] .dot{background:currentColor;border-color:currentColor}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
select,textarea,input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;transition:border-color .2s}
select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:110px;resize:vertical;font-family:var(--f-read);line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.status{font-size:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.status.err{color:var(--bad);background:var(--bad-soft)}
.badge{display:inline-block;font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:6px;background:var(--flag-soft);color:var(--flag);vertical-align:1px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}

/* quiz (focus mode: no site navigation) */
body.focus .bar,body.focus .dock{display:none!important}
body.focus main{padding-top:0}
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:8px;padding-block:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.qprog{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.qprog>span{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .45s var(--ease)}
.qcount{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
.timer{font:600 13.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qcard{display:flex;flex-direction:column;gap:18px;padding-block:18px 8px}
.qmeta{font-size:13px;color:var(--muted)}
.passage{font-family:var(--f-read);font-size:16px;line-height:1.65;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.passage .cap{font:600 12px var(--f-body);color:var(--muted);margin-bottom:8px}
.passage table{border-collapse:collapse;font:14px var(--f-body);font-variant-numeric:tabular-nums}
.passage th,.passage td{border-bottom:1px solid var(--line);padding:7px 14px 7px 0;text-align:left}
.passage th{font-weight:650}
.qtext{font-family:var(--f-read);font-size:clamp(18px,2.6vw,21px);line-height:1.5;white-space:pre-line;font-weight:450}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:15.5px;line-height:1.4;transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--faint);color:var(--muted);display:grid;place-items:center;font:600 13px/1 var(--f-body);flex:none;transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .bub{background:var(--lead);border-color:var(--lead);color:var(--bg)}
.opt.just .bub{animation:pop .32s var(--ease)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.otext{min-width:0;overflow-wrap:anywhere}
.fb{padding:16px 18px;border-radius:var(--r);display:flex;flex-direction:column;gap:8px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-family:var(--f-display);font-size:16px}
.fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
.fb.enter{animation:rise .35s var(--ease) both}
.explain{font-family:var(--f-read);font-size:15.5px;line-height:1.6;white-space:pre-wrap;padding:14px 16px;background:var(--surface);border-radius:var(--r-sm)}
.qfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-block:14px 8px}
.qfoot .grp{display:flex;gap:8px}
.flagbtn[aria-pressed="true"]{background:var(--flag-soft);color:var(--flag);border-color:transparent}
.confirm{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.slide-next{animation:inR .32s var(--ease) both}
.slide-prev{animation:inL .32s var(--ease) both}

/* bottom sheets (answer sheet, scratch paper) */
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding:10px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s linear .38s;max-width:760px;margin:0 auto}
.bsheet.open{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s}
.bsheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.bsheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(10,14,20,.32);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:46vh;overflow:auto;padding:2px}
.cell{position:relative;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:550 12px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;padding:0;transition:background .2s}
.cell.ans{background:var(--lead);border-color:var(--lead);color:var(--bg)}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--flag);border:1.5px solid var(--surface)}
.sidefoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.scratch{height:min(52vh,480px);display:flex;flex-direction:column;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.scratch canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;border-radius:12px;background-color:var(--surface-2);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 30px}
.scratch-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:8;box-shadow:var(--shadow);animation:rise .35s var(--ease) both}
body.scratch-open main{padding-bottom:calc(min(52vh,480px) + 30px)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* results */
.res-head{display:flex;flex-direction:column;gap:6px;padding:26px 22px;align-items:flex-start}
.score{font:780 clamp(56px,13vw,84px)/.95 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.score small{font-size:.32em;font-weight:620;color:var(--muted);letter-spacing:0;margin-left:4px}
.stamp{display:inline-flex;align-items:center;gap:8px;font:650 14px/1 var(--f-body);padding:8px 13px;border-radius:999px;margin-top:6px;animation:rise .5s .25s var(--ease) both}
.stamp small{font-weight:500;opacity:.85}
.stamp.ok{color:var(--ok);background:var(--ok-soft)} .stamp.bad{color:var(--bad);background:var(--bad-soft)}
.rv{border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:13px 18px;cursor:pointer;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv .n{font-size:12.5px;color:var(--faint);min-width:2.2em;font-variant-numeric:tabular-nums}
.rv .tq{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.rv .mk{font-weight:700;font-size:13px}
.rv.ok .mk{color:var(--ok)} .rv.bad .mk{color:var(--bad)}
.rv[open] .rv-body{animation:rise .3s var(--ease) both}
.rv-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.rv-body ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rv-body li{display:flex;gap:10px;align-items:baseline;font-size:14.5px}
.rv-body li .bub{width:24px;height:24px;font-size:11px}
.rv-body li.isk .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.rv-body li.mine .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.rv-body .why{font-size:14px;color:var(--muted)}

/* lists, prose, tables */
.list{list-style:none;margin:0;padding:0}
.list>li{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.list>li:last-child{border-bottom:0}
.list .q{font-family:var(--f-read);font-size:15.5px;line-height:1.45;white-space:pre-line}
.list small{color:var(--muted);font-size:12.5px}
.prose{display:flex;flex-direction:column;gap:14px;font-size:15.5px}
.prose h2{margin-top:12px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
table.mix{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
table.mix th,table.mix td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
table.mix tr:last-child td{border-bottom:0}
table.mix th{font-size:12.5px;font-weight:600;color:var(--muted)}
table.mix td.r,table.mix th.r{text-align:right}
.tablewrap{overflow-x:auto}

/* learn */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lesson-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.lesson-card:hover{border-color:transparent;box-shadow:var(--shadow);transform:translateY(-1px)}
.lesson-card .t{font-weight:660;font-size:15.5px;display:flex;gap:9px;align-items:center}
.lesson-card .d{font-size:13.5px;color:var(--muted)}
.lesson-card .m{font-size:12px;color:var(--faint)}
.lesson{display:flex;flex-direction:column;gap:16px}
.lsec{padding:20px 22px;display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.65}
.lsec ul,.lsec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
pre.calc{font:13.5px/1.55 var(--f-mono);background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;margin:0;white-space:pre}
.worked{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.worked .q{font-family:var(--f-read);font-size:17.5px;line-height:1.5}
.worked ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.worked li.enter,.worked .ans.enter{animation:rise .35s var(--ease) both}
.worked .ans{font-weight:680;color:var(--ok)}
.tutor{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.msg{padding:11px 14px;border-radius:14px;white-space:pre-wrap;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg:last-child{animation:rise .3s var(--ease) both}
.face{overflow:auto}
main>section:not(#v-home):not(#v-quiz){padding-top:8px}
.msg.me{background:var(--accent-soft);align-self:flex-end;max-width:88%}
.msg.ai{background:var(--surface-2);font-family:var(--f-read);font-size:15.5px}

/* flashcards: a real 3D flip */
.flip{perspective:1200px}
.flip-in{position:relative;min-height:260px;transition:transform .55s var(--ease);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer;text-align:left;width:100%}
.face.back{transform:rotateY(180deg)}
.face .front-q{font-family:var(--f-read);font-size:19px;line-height:1.45}
.face .ansr{font-size:18px;font-weight:700;color:var(--ok)}
.face .why{font-size:14.5px;color:var(--muted)}
.face .hint{font-size:13px;color:var(--faint)}

/* trends chart */
.chart{position:relative;padding:18px 16px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--muted);font:12px var(--f-body);font-variant-numeric:tabular-nums}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .15s var(--ease) forwards}
.chart .area{fill:var(--accent);opacity:.08}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2;transition:r .15s}
.chart .pt.on{r:6}
.chart .lab{fill:var(--ink);font:600 12px var(--f-body);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.stat{display:flex;flex-direction:column;gap:4px;padding:20px 22px}
.stat .big{font:780 40px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline}
.facts li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);transform:translateY(-2px)}

/* settings */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px 10px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
.theme-opt:active{transform:scale(.98)}
.theme-opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-opt .swatch{display:block;height:64px;border-radius:9px;padding:10px;margin-bottom:6px;border:1px solid var(--line)}
.theme-opt .swatch>span{display:flex;flex-direction:column;gap:5px;height:100%;border-radius:6px;padding:8px}
.theme-opt .swatch i{display:block;height:4px;border-radius:2px;opacity:.75}
.theme-opt .t{font-weight:650;font-size:14.5px}
.theme-opt .m{font-size:12px;color:var(--muted);line-height:1.35}
html.theme-fade body,html.theme-fade body *{transition:background-color .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease),fill .4s var(--ease),stroke .4s var(--ease)!important}

/* motion */
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sp{to{transform:rotate(360deg)}}
.view-enter{animation:rise .38s var(--ease) both}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(n+6){animation-delay:.2s}
::view-transition-old(root){animation:.18s var(--ease) both vtOut}
::view-transition-new(root){animation:.3s var(--ease) both vtIn}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}}

@media (max-width:720px){
  .tabs{display:none}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;position:relative;transition:color .2s}
  .dock button svg{width:22px;height:22px;transition:transform .25s var(--ease)}
  .dock button[aria-current="page"]{color:var(--accent)}
  .dock button[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
  .dock .mcount{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .scratch-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.focus .scratch-fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){
  .ready{grid-template-columns:1fr}
  .arow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .arow .track{grid-column:1/-1;grid-row:2}
  .brand b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
  .chart .line{stroke-dashoffset:0}
  ::view-transition-old(root),::view-transition-new(root){animation:none}
}

/* ===== app layer: iOS-style navigation, launch screen, tour, Math Basics ===== */
:root{
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --ios:cubic-bezier(.32,.72,0,1);
  --cheese:#f2b33d; --cheese-soft:#fdf1d8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cheese:#e9ad3f;--cheese-soft:#3a2f17}}
:root[data-theme="dark"]{--cheese:#e9ad3f;--cheese-soft:#3a2f17}
body{letter-spacing:-.005em}
h1{font-size:clamp(30px,7vw,34px);font-weight:750;letter-spacing:-.025em}

/* nav bar */
.bar{view-transition-name:navbar;transition:box-shadow .25s,background .25s}
.bar.scrolled{box-shadow:0 .5px 0 var(--line)}
.bar-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding-block:8px;min-height:52px}
.bar.root .nav-t{visibility:hidden}
.bar:not(.root) .nav-t{padding-right:44px}
.nav-l{display:flex;align-items:center;min-width:0}
.nav-r{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.nav-t{font-weight:650;font-size:16px;text-align:center;min-width:0;opacity:0;transform:translateY(4px);transition:opacity .25s var(--ease),transform .25s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:none}
.bar.scrolled .nav-t{opacity:1;transform:none}
.bw{display:flex;flex-direction:column;line-height:1.05}
.bw small{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.navback{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 8px 6px 0;color:var(--accent);font-size:16px;font-weight:500;cursor:pointer;min-width:0;max-width:44vw}
.navback span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navback svg{width:22px;height:22px;flex:none}
.navback:active{opacity:.5}

/* tab bar on every screen size */
.tabs{display:none!important}
.dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;justify-content:center;gap:0;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:.5px solid var(--line);view-transition-name:dock}
.dock button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:5px 4px;font-size:10.5px;font-weight:600;color:var(--faint);cursor:pointer;position:relative;transition:color .2s}
.dock button svg{width:24px;height:24px;transition:transform .3s var(--ios)}
.dock button:active svg{transform:scale(.86)}
.dock button[aria-current="page"]{color:var(--accent)}
.dock .mcount{position:absolute;top:1px;left:calc(50% + 7px);margin:0}
main{padding-bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.scratch-fab{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.focus .scratch-fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.menu>button{min-height:60px}
.menu>button:active{background:var(--surface-2)}

/* page transitions: push, pop, tab, and modal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html[data-nav="push"]::view-transition-new(root){animation:.44s var(--ios) both vtPushIn;z-index:2;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
html[data-nav="push"]::view-transition-old(root){animation:.44s var(--ios) both vtPushOut}
html[data-nav="pop"]::view-transition-old(root){animation:.4s var(--ios) both vtPopOut;z-index:2}
html[data-nav="pop"]::view-transition-new(root){animation:.4s var(--ios) both vtPopIn}
html[data-nav="tab"]::view-transition-old(root){animation:.16s ease both vtFade}
html[data-nav="tab"]::view-transition-new(root){animation:.26s var(--ease) both vtRise}
html[data-nav="up"]::view-transition-new(root){animation:.46s var(--ios) both vtUp;z-index:2}
html[data-nav="up"]::view-transition-old(root){animation:.46s var(--ios) both vtDim}
html[data-nav="down"]::view-transition-old(root){animation:.4s var(--ios) both vtDown;z-index:2}
html[data-nav="down"]::view-transition-new(root){animation:.4s var(--ios) both vtUndim}
@keyframes vtPushIn{from{transform:translateX(100%)}}
@keyframes vtPushOut{to{transform:translateX(-26%);opacity:.7}}
@keyframes vtPopOut{to{transform:translateX(100%)}}
@keyframes vtPopIn{from{transform:translateX(-26%);opacity:.7}}
@keyframes vtFade{to{opacity:0}}
@keyframes vtRise{from{opacity:0;transform:translateY(6px)}}
@keyframes vtUp{from{transform:translateY(100%)}}
@keyframes vtDown{to{transform:translateY(100%)}}
@keyframes vtDim{to{transform:scale(.96);opacity:.6}}
@keyframes vtUndim{from{transform:scale(.96);opacity:.6}}
.nav-push{animation:.42s var(--ios) both vtPushIn}
.nav-pop{animation:.38s var(--ios) both vtPopIn}
.nav-up{animation:.44s var(--ios) both vtUp}

/* launch screen */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-logo svg{display:block;overflow:visible}
.sp-ring{fill:none;stroke:var(--drop);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:60px 60px;animation:draw .9s .1s var(--ios) forwards}
.sp-fill{fill:var(--lead);transform-origin:60px 60px;transform:scale(0);animation:spFill .55s .7s var(--ios) forwards}
.sp-p{fill:var(--bg);font:800 44px var(--f-display);opacity:0;animation:spP .4s 1.05s var(--ease) forwards}
.sp-word{font:780 34px/1.1 var(--f-display);letter-spacing:-.03em;margin-top:14px;opacity:0;animation:rise .5s 1.15s var(--ease) both}
.sp-tag{font-size:15px;font-weight:600;opacity:0;animation:rise .5s 1.3s var(--ease) both}
.sp-tag2{font-size:13px;color:var(--muted);opacity:0;animation:rise .5s 1.4s var(--ease) both}
.sp-foot{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:24px;right:24px;font-size:11.5px;color:var(--faint);opacity:0;animation:rise .5s 1.5s var(--ease) both}
#splash.quick .sp-ring,#splash.quick .sp-fill,#splash.quick .sp-p,#splash.quick .sp-word,#splash.quick .sp-tag,#splash.quick .sp-tag2,#splash.quick .sp-foot{animation-duration:.35s;animation-delay:0s}
@keyframes spFill{0%{transform:scale(0)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes spP{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* welcome tour */
.onb{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));animation:rise .4s var(--ease) both}
.onb-top{display:flex;justify-content:flex-end;min-height:36px}
.onb-pages{flex:1;position:relative;overflow:hidden;max-width:520px;width:100%;margin:0 auto}
.onb-track{display:flex;height:100%;transition:transform .5s var(--ios)}
.onb-page{flex:0 0 100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:8px 2px}
.onb-page h2{font-size:clamp(26px,7vw,32px);font-weight:760;letter-spacing:-.025em;line-height:1.12}
.onb-page p{font-size:16.5px;color:var(--muted);max-width:42ch}
.onb-art{height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.onb-foot{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .35s var(--ios),background .35s}
.dots i.on{width:22px;background:var(--accent)}
.lvlpick{display:flex;flex-direction:column;gap:10px}
.lvlpick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 18px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s,transform .15s}
.lvlpick button:active{transform:scale(.98)}
.lvlpick button[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lvlpick b{font-size:16.5px}
.lvlpick span{font-size:13.5px;color:var(--muted)}
.art-bubbles{display:flex;gap:12px}
.art-bubbles i{width:46px;height:46px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;font-style:normal;font-weight:650;color:var(--muted);animation:rise .5s var(--ease) both}
.art-bubbles i.on{background:var(--lead);border-color:var(--lead);color:var(--bg);animation:pop .5s .5s var(--ease) both}
.art-chip{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:650;font-size:14px}
.art-bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.art-bars i{width:30px;border-radius:8px 8px 4px 4px;background:var(--accent);transform-origin:bottom;animation:barUp .7s var(--ios) both}
@keyframes barUp{from{transform:scaleY(0)}}

/* coach marks */
.coach{position:fixed;inset:0;z-index:80}
.coach .spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(8,12,18,.62);transition:all .45s var(--ios);pointer-events:none}
.coach .tipc{position:fixed;left:16px;right:16px;max-width:360px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3);transition:top .45s var(--ios),opacity .3s;display:flex;flex-direction:column;gap:10px}
.coach .tipc .row{justify-content:space-between}
.coach .tipc small{color:var(--muted);font-weight:600}

/* Math Basics */
.gamecard{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent-soft),var(--cheese-soft));border:0;cursor:pointer;text-align:left;width:100%;transition:transform .2s var(--ios)}
.gamecard:active{transform:scale(.985)}
.gamecard .gc-art{flex:none}
.gamecard b{display:block;font-size:17px}
.gamecard span{font-size:13.5px;color:var(--muted)}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 8px;text-align:center}
.gstats b{display:block;font-size:22px;font-weight:750}
.gstats b small{font-size:13px;color:var(--muted);font-weight:600}
.gstats span{font-size:12px;color:var(--muted)}
.world{margin-top:22px}
.world-head{text-align:center;margin-bottom:12px}
.world-head .wn{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.world-head p{font-size:13.5px}
.path{display:flex;flex-direction:column;align-items:center;gap:16px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.node{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .12s,box-shadow .12s;position:relative}
.node:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.node .sym{font-size:22px;font-weight:800;letter-spacing:-.02em}
.node.done{background:var(--ok);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 60%,#000);color:#fff}
.node.locked{background:var(--surface-2);color:var(--faint);box-shadow:0 5px 0 var(--line);cursor:not-allowed}
.node.now::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);animation:ping 1.8s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.9}80%,100%{transform:scale(1.25);opacity:0}}
.node-l{font-size:13px;font-weight:600;text-align:center;line-height:1.25}
.node-s i{font-style:normal;color:var(--line);font-size:13px}
.node-s i.on{color:var(--cheese)}
.eli5{padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.eli-vis{min-height:120px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;width:100%}
.eli-t{font-size:18px;line-height:1.55;max-width:44ch}
.vplus{font-size:28px;font-weight:700;color:var(--muted)}
.pz .sl{fill:var(--surface-2);stroke:var(--surface);stroke-width:2.5;transition:fill .25s var(--ease)}
.pz .sl.on{fill:var(--cheese);animation:pop .45s var(--d) var(--ease) both;transform-box:fill-box;transform-origin:center}
.pz.tap .sl{cursor:pointer}
.pz.tap .sl:hover{fill:color-mix(in srgb,var(--cheese) 35%,var(--surface-2))}
.pz.tap .sl.on:hover{fill:var(--cheese)}
.fbars{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}

const SP = { tool: 'pen', ctx: null, w: 0, h: 0, pages: 2, maxY: 0, ptrs: new Map(), panY: null, drawing: false, last: null };

/* ---------- smart mock: weight topics by weakness ---------- */
function startSmart() {
  const L = LEVELS[level], items = [], seen = new Set();
  for (const [a, n] of Object.entries(L.mini)) {
    const ts = AREAS[a].topics, w = ts.map(t => { const s = Store.state.stats[a + '|' + t]; const acc = s && s[1] ? s[0] / s[1] : 0.5; return 0.3 + (1 - acc) * 2; }), tot = w.reduce((x, y) => x + y, 0);
    let g = 0;
    while (items.filter(i => i.area === a).length < n && g++ < n * 8) {
      let r = Math.random() * tot, k = 0; while ((r -= w[k]) > 0 && k < ts.length - 1) k++;
      const it = draw(a, 1, [ts[k]])[0]; if (it && !seen.has(it.q)) { seen.add(it.q); items.push(it); }
    }
  }
  startSession({ mode: 'mock', title: 'Smart mock · weak topics first', items, limit: L.miniMins * 60 });
}

/* ---------- pace: seconds per item by part ---------- */
function paceReport(r) {
  const L = LEVELS[r.level] || LEVELS[level], target = L.mins * 60 / L.items, by = {};
  if (r.mode === 'sim' && r.times) {
    const order = r.times.map((t, i) => ({ t, i })).filter(o => o.t != null).sort((a, b) => a.t - b.t);
    order.forEach((o, k) => { const d = o.t - (k ? order[k - 1].t : 0), a = r.items[o.i].area; (by[a] = by[a] || [0, 0])[0] += d; by[a][1]++; });
  } else if (r.tspent) r.tspent.forEach((s, i) => { const a = r.items[i].area; (by[a] = by[a] || [0, 0])[0] += s; by[a][1]++; });
  const rows = Object.entries(by).filter(([, v]) => v[1]).map(([a, [s, n]]) => ({ a, per: s / n }));
  return rows.length ? { target, rows } : null;
}

/* ---------- backup and restore ---------- */
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function makeBackup() {
  const data = JSON.stringify({ app: 'pasado', v: 1, t: Date.now(), state: Store.state, forge: Store.forge, prefs: { level, theme: themePref } });
  try { const buf = await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return 'PSD1.' + b64(buf); }
  catch { return 'PSD0.' + btoa(unescape(encodeURIComponent(data))); }
}
async function readBackup(code) {
  code = code.trim().replace(/\s+/g, '');
  if (code.startsWith('PSD1.')) return JSON.parse(await new Response(new Blob([unb64(code.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  if (code.startsWith('PSD0.')) return JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
  throw new Error('not a Pasado backup code');
}

/* ---------- daily reminder (Android app) ---------- */
const LN = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
async function setReminder(on, time) {
  const ln = LN(); if (!ln) return false;
  try {
    await ln.cancel({ notifications: [{ id: 1001 }] }).catch(() => {});
    if (!on) return true;
    const perm = await ln.requestPermissions(); if (perm.display !== 'granted') return false;
    const [h, m] = time.split(':').map(Number);
    await ln.schedule({ notifications: [{ id: 1001, title: 'Pasado', body: 'Time for today’s review. A few minutes a day keeps your rating climbing.', schedule: { on: { hour: h, minute: m }, allowWhileIdle: true } }] });
    return true;
  } catch { return false; }
}

function copyText(t, msg) {

}

      <p class="muted" style="font-size:14px">${Store.cloud ? 'Synced to your account, so it follows you across devices.' : 'Saved on this device.'} Use a backup code to move it to another phone or between the app and claude.ai.</p>
      ${backupUI && backupUI.mode === 'out' ? `<textarea id="bkOut" readonly style="font-family:var(--f-mono);font-size:12px;min-height:90px">${esc(backupUI.code)}</textarea><div class="row"><button class="btn primary small" data-act="bk-copy">Copy code</button><button class="btn quiet small" data-act="bk-done">Done</button></div>`
        : backupUI && backupUI.mode === 'in' ? `<textarea id="bkIn" placeholder="Paste your backup code (starts with PSD)" style="font-family:var(--f-mono);font-size:12px;min-height:90px"></textarea>${backupUI.err ? `<div class="status err">${esc(backupUI.err)}</div>` : ''}<div class="row"><button class="btn primary small" data-act="bk-restore">Restore and replace my progress</button><button class="btn quiet small" data-act="bk-done">Cancel</button></div>`
        : '<div class="row"><button class="btn small" data-act="bk-make">Back up progress</button><button class="btn quiet small" data-act="bk-in">Restore from a code</button></div>'}
      <div class="setrow"><div><b>Reported problems</b><span>${reps ? `${reps} saved on this device` : 'None yet. Tap “Report a problem” on any item.'}</span></div>${reps ? '<button class="btn quiet small" data-act="rep-copy">Copy</button>' : ''}</div>
      ${confirmReset ? `<div class="confirm"><span>Erase all scores, mistakes, and lesson progress? This can’t be undone.</span><div class="row" style="gap:6px"><button class="btn quiet small" data-act="reset-no">Cancel</button><button class="btn danger small" data-act="reset-yes">Erase</button></div></div>` : '<button class="btn danger small" style="align-self:flex-start" data-act="reset">Reset progress</button>'}
    </div>
    <div class="menu">${mrow('data-act="tour"', 'spark', 'Replay the welcome tour', 'The intro screens and the guided tips')}${mrow('data-go="about"', 'info', 'How Pasado works', 'Sources, privacy, and installing on your phone')}</div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { if (g.dataset.plan) planMark(g.dataset.plan); go(g.dataset.go); return; }
  const lv = e.target.closest('[data-level]'); if (lv) { level = lv.dataset.level; LS.set('pasado.level', level); render(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act;
  switch (act) {
    case 'review-due': { const items = shuffle(dueMistakes()).slice(0, 30).map(m => m.q); if (!items.length) { toast('Nothing is due right now.'); return; } startSession({ mode: 'review', title: 'Spaced review', items }); if (S) S.planTask = 'review'; return; }
    case 'plan-drill': { const w = weakestArea(), n = (Store.state.plan || {}).mins >= 60 ? 20 : 10; startSession({ mode: 'drill', title: `Plan · ${AREAS[w.a].name}`, items: draw(w.a, n) }); if (S) S.planTask = 'drill'; return; }
    case 'plan-tick': { const id = b.dataset.id, D = Store.state.planDone || (Store.state.planDone = {}), k = today(); D[k] = D[k] || []; const i = D[k].indexOf(id); if (i >= 0) D[k].splice(i, 1); else D[k].push(id); Store.save('state'); haptic('light'); renderHome(); return; }
    case 'plan-exam': planDraft.exam = b.dataset.d; renderPlan(); return;
    case 'plan-mins': planDraft.mins = +b.dataset.m; renderPlan(); return;
    case 'plan-save': Store.state.plan = { exam: planDraft.exam, mins: planDraft.mins, start: today() }; Store.save('state'); toast('Plan saved. Your daily tasks are on Home.'); go('home'); return;
    case 'plan-clear': delete Store.state.plan; Store.save('state'); planDraft = null; renderPlan(); return;
    case 'report': { const q = b.dataset.src === 'quiz' ? S && S.items[+b.dataset.i] : lastResult && lastResult.items[+b.dataset.i]; if (q) openReport(q); return; }
    case 'rep-close': closeReport(); return;
    case 'rep-reason': document.querySelectorAll('#repReasons .chip').forEach(x => x.setAttribute('aria-checked', String(x === b))); return;
    case 'rep-save': saveReport(); return;
    case 'rep-copy': { const txt = (Store.state.reports || []).map(r => `[${new Date(r.t).toLocaleDateString('en-PH')}] ${r.reason} · ${r.area} / ${r.topic} · ${r.id}\nQ: ${r.q}\nKey: ${r.answer}${r.note ? '\nNote: ' + r.note : ''}`).join('\n\n'); copyText(txt, 'Reports copied.'); return; }
    case 'check': { const C = Store.state.check || (Store.state.check = {}); C[b.dataset.id] = !C[b.dataset.id]; Store.save('state'); haptic('light'); renderChecklist(); return; }
    case 'sim-start': startSim(); if (S) S.planTask = 'full'; return;
    case 'smart-start': startSmart(); return;
    case 'sim-tab': { S.simTab = b.dataset.t; const s = document.querySelector('.sim'); if (s) s.className = 'sim ' + S.simTab; document.querySelectorAll('[data-act="sim-tab"]').forEach(x => x.setAttribute('aria-checked', String(x === b))); window.scrollTo(0, 0); return; }
    case 'sim-shade': simShade(+b.dataset.i, +b.dataset.j); return;
    case 'sim-goto': { const i = +b.dataset.i; if (innerWidth < 900) { S.simTab = 'sheet'; const s = document.querySelector('.sim'); if (s) s.className = 'sim sheet'; document.querySelectorAll('[data-act="sim-tab"]').forEach(x => x.setAttribute('aria-checked', String(x.dataset.t === 'sheet'))); } const row = $('#omr-' + i); if (row) { row.scrollIntoView({ block: 'center', behavior: calm() ? 'auto' : 'smooth' }); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); } return; }
    case 'speak': { const q = S && S.items[S.idx]; if (q) speakItem(q, q.ord); return; }
    case 'textsize': setPref('textsize', +b.dataset.v); applyDisplay(); renderSettings(); return;
    case 'contrast': setPref('contrast', !pref('contrast', false)); applyDisplay(); renderSettings(); return;
    case 'scratch': setPref('scratch', !scratchOn()); updateFab(); renderSettings(); return;
    case 'speakbtn': if (canSpeak()) { setPref('speak', !pref('speak', true)); renderSettings(); } return;
    case 'reminder': { const r = pref('reminder', { on: false, time: '19:00' }); r.on = !r.on; setReminder(r.on, r.time).then(ok => { if (!ok && r.on) { r.on = false; toast('Notifications are off for Pasado. Allow them in Android settings.'); } setPref('reminder', r); renderSettings(); }); return; }
    case 'bk-make': makeBackup().then(code => { backupUI = { mode: 'out', code }; renderSettings(); }); return;
    case 'bk-copy': copyText(backupUI.code, 'Backup code copied.'); return;
    case 'bk-done': backupUI = null; renderSettings(); return;
    case 'bk-in': backupUI = { mode: 'in' }; renderSettings(); return;
    case 'bk-restore': { const code = ($('#bkIn') || {}).value || ''; readBackup(code).then(o => { if (!o || o.app !== 'pasado' || !o.state) throw new Error('bad'); Store.state = normState(o.state); Store.forge = Array.isArray(o.forge) ? o.forge : []; Store.save('state'); Store.save('forge'); if (o.prefs && LEVELS[o.prefs.level]) { level = o.prefs.level; LS.set('pasado.level', level); } backupUI = null; counted = false; toast('Progress restored.'); render(); }).catch(() => { backupUI = { mode: 'in', err: 'That code didn’t work. Copy the whole code, starting with PSD.' }; renderSettings(); }); return; }
  }
  if (act.startsWith('g-') && Game.handle(act, b)) return;
  if (act === 'hack') { curHack = HX.HACKS.find(x => x.id === b.dataset.id) || null; if (view === 'hack') { renderHack(); updateNav('hack'); window.scrollTo({ top: 0, behavior: calm() ? 'auto' : 'smooth' }); } else go('hack'); return; }
  if (act === 'hack-practice') { const [a, t] = curHack.practice; startSession({ mode: 'drill', title: 'Practice · ' + curHack.title, items: draw(a, 10, [t]) }); return; }
  if (act === 'hack-strip') { setTpl('az'); spOpen(); return; }
  if (act === 'spot-pick') { if (spot.picked != null) return; spot.picked = b.dataset.t; const ok = spot.picked === spot.items[spot.i].h.type; if (ok) spot.score++; haptic(ok ? 'success' : 'error'); renderSpot(); return; }
  if (act === 'spot-next') { spot.i++; spotOpts(); renderSpot(); window.scrollTo(0, 0); return; }
  if (act === 'spot-again') { spot = null; startSpot(); renderSpot(); return; }
  if (act === 'sp-tpl') { setTpl(b.dataset.k); haptic('light'); return; }
  switch (act) {
    case 'mock-full': startMock('full'); break;
    case 'mock-mini': startMock('mini'); break;
    case 'resume': go('quiz'); break;
    case 'discard': S = null; saveSession(); render(); break;
    case 'drill-area': drillSel.area = b.dataset.area; drillSel.topics = null; go('drill'); break;
    case 'd-area': drillSel.area = b.dataset.area; drillSel.topics = null; renderDrill(); break;
    case 'd-topic': { const all = AREAS[drillSel.area].topics, cur = new Set(drillSel.topics || all), t = b.dataset.topic; cur.has(t) ? cur.delete(t) : cur.add(t); drillSel.topics = all.filter(x => cur.has(x)); renderDrill(); break; }
    case 'd-n': drillSel.n = +b.dataset.n; renderDrill(); break;
    case 'd-start': { const topics = drillSel.topics || AREAS[drillSel.area].topics; startSession({ mode: 'drill', title: `Drill · ${AREAS[drillSel.area].name}`, items: draw(drillSel.area, drillSel.n, topics) }); break; }
    case 'choose': choose(+b.dataset.o); break;
    case 'next': move(1); break;
    case 'prev': move(-1); break;
    case 'jump': S.idx = +b.dataset.i; S.confirm = false; sheetsClose(); saveSession(); renderQuiz(); break;
    case 'flag': S.flag[S.idx] = !S.flag[S.idx]; saveSession(); renderQuiz(); break;
    case 'sheet': sheetOpen(); break;
    case 'sheets-close': sheetsClose(); closeReport(); break;
    case 'submit': S.confirm = true; sheetsClose(); renderQuiz(); requestAnimationFrame(() => { const c = $('.confirm'); if (c) c.scrollIntoView({ behavior: calm() ? 'auto' : 'smooth', block: 'center' }); }); break;
    case 'quit': back(); break;
    case 'back': back(); break;
    case 'onb-next': onbGo(onbI + 1); break;
    case 'onb-skip': onbGo(ONB.length - 1); break;
    case 'onb-level': onbLevel = b.dataset.l; document.querySelectorAll('.lvlpick [data-act="onb-level"]').forEach(x => x.setAttribute('aria-checked', String(x === b))); haptic('light'); break;
    case 'onb-done': finishOnboarding(); break;
    case 'coach-next': coachI++; if (coachI >= COACH.length) endCoach(); else drawCoach(); break;
    case 'coach-end': endCoach(); break;
    case 'tour': showOnboarding(); break;
    case 'level': level = level === 'pro' ? 'sub' : 'pro'; LS.set('pasado.level', level); render(); break;
    case 'set-level': level = b.dataset.l; LS.set('pasado.level', level); render(); break;
    case 'theme': themePref = b.dataset.t; LS.set('pasado.theme', themePref); applyTheme(true); renderSettings(); break;
    case 'reset': confirmReset = true; renderSettings(); break;
    case 'reset-no': confirmReset = false; renderSettings(); break;
    case 'reset-yes': Store.state = blank(); Store.save('state'); confirmReset = false; counted = false; render(); break;
    case 'today': { const w = weakestArea(); startSession({ mode: 'drill', title: `Today · ${AREAS[w.a].name}`, items: draw(w.a, 10) }); break; }
    case 'submit-no': S.confirm = false; renderQuiz(); break;
    case 'submit-yes': case 'finish': finish(); break;
    case 'rv-all': lastResult.wrongOnly = false; renderResults(); break;
    case 'rv-wrong': lastResult.wrongOnly = true; renderResults(); break;
    case 'retake-wrong': { const items = lastResult.items.filter((q, i) => lastResult.ans[i] !== q.k).map(q => { const o = Object.assign({}, q); delete o.ord; return o; }); startSession({ mode: 'review', title: 'Missed items', items }); break; }
    case 'review': { const areas = levelAreas(); const items = Object.values(Store.state.mistakes).filter(m => areas.includes(m.q.area)).sort((a, b) => b.miss - a.miss || b.at - a.at).slice(0, 30).map(m => m.q); startSession({ mode: 'review', title: 'Fix my mistakes', items: shuffle(items) }); break; }
    case 'm-remove': delete Store.state.mistakes[b.dataset.id]; Store.save('state'); render(); break;
    case 'lesson': curLesson = LESSONS.find(l => l.id === b.dataset.id) || null; LS.set('pasado.lesson', b.dataset.id); go('lesson'); break;
    case 'ex-step': { const s = exStep[curLesson.id], i = +b.dataset.e; s[i]++; lessonReveal = { e: i }; renderLesson(); break; }
    case 'ex-all': { const s = exStep[curLesson.id], i = +b.dataset.e; s[i] = curLesson.examples[i].steps.length; lessonReveal = { e: i, all: true }; renderLesson(); break; }
    case 'lesson-done': { const L = Store.state.lessons || (Store.state.lessons = {}); if (L[curLesson.id]) delete L[curLesson.id]; else L[curLesson.id] = Date.now(); Store.save('state'); renderLesson(); break; }
    case 'lesson-practice': if (!Store.state.lessons) Store.state.lessons = {}; if (!Store.state.lessons[curLesson.id]) { Store.state.lessons[curLesson.id] = Date.now(); Store.save('state'); } startSession({ mode: 'drill', title: `Practice · ${curLesson.title}`, items: lessonItems(curLesson) }); break;
    case 'cards': startCards(b.dataset.topic, b.dataset.area); break;
    case 'card-flip': cardFlip(); break;
    case 'card-know': cardGrade(cards.deck[0].id, true); cards.deck.shift(); cards.known++; cards.flipped = false; renderCards(); break;
    case 'card-again': cardGrade(cards.deck[0].id, false); cards.deck.push(cards.deck.shift()); cards.flipped = false; renderCards(); break;
    case 'card-restart': startCards(cards.topic, BANK.find(q => q.topic === cards.topic).area); break;
    case 'scratch-open': spOpen(); break;
    case 'scratch-close': spClose(); break;
    case 'sp-pen': spTool('pen'); break;
    case 'sp-erase': spTool('erase'); break;
    case 'sp-clear': spClear(); break;
    case 'sp-more': spMore(); break;
    case 'sp-expand': spExpand(); break;
    case 'install': if (installEvt) { installEvt.prompt(); Promise.resolve(installEvt.userChoice).finally(() => { installEvt = null; $('#installBtn').hidden = true; }); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset && t.dataset.act; if (!act) return;
  if (act === 'rem-time') { const r = pref('reminder', { on: true, time: '19:00' }); r.time = t.value; setPref('reminder', r); setReminder(r.on, r.time); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (spIsOpen()) spClose(); sheetsClose(); }
  if (view !== 'quiz' || !S || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  const k = e.key.toLowerCase(), q = S.items[S.idx];
  const j = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (j >= 0 && k.length === 1) { e.preventDefault(); choose(q.ord[j]); return; }
  if (k === 'arrowright' || (k === 'enter' && document.activeElement === document.body)) { if (S.mode === 'mock' || S.ans[S.idx] != null) { if (S.idx < S.items.length - 1) move(1); else if (S.mode !== 'mock') finish(); } }
  else if (k === 'arrowleft') move(-1);
  else if (k === 'f' && S.mode === 'mock') { S.flag[S.idx] = !S.flag[S.idx]; saveSession(); renderQuiz(); }
});
window.addEventListener('pagehide', saveSession);

/* ---------- boot ---------- */
const startView = LS.get('pasado.view', 'home');
curLesson = LESSONS.find(l => l.id === LS.get('pasado.lesson', '')) || null;
go(VIEWS.includes(startView) && !['quiz', 'results', 'cards', 'glearn', 'gplay'].includes(startView) ? startView : 'home');
setTpl(spTplKey);
hideSplash();
initCloud();
})();
</script>
